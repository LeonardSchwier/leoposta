# Real Dovecot for the e2e suite: "." separator with an "INBOX." prefix (common on shared hosting), and the
# special-use mailboxes a hosted mailbox has (RFC 6154).
namespace inbox {
  separator = .
  prefix = INBOX.
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
  mailbox Archive {
    special_use = \Archive
    auto = subscribe
  }
}

# Test instance only: plaintext on loopback, so clients do not try STARTTLS
# against the image's self-signed certificate.
ssl = no
auth_allow_cleartext = yes
